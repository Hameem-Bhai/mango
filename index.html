    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. Mango BD — 100% Authentic Vape Shop</title>
    <meta name="description" content="Mr. Mango BD — Bangladesh's premier destination for 100% authentic vapes, disposables, pod kits, and e-liquids. Flagship outlet at Tong Market, Kuril (Beside AIUB), Dhaka." />
    <meta name="author" content="Hameem Bhai — hameembhaierdokan.studio" />
    <link rel="author" href="/humans.txt" />

    <!-- Social & WhatsApp Link Preview Meta Tags (Shows Logo when link is shared) -->
    <meta property="og:site_name" content="Mr. Mango BD" />
    <meta property="og:title" content="Mr. Mango BD — 100% Authentic Vape Shop" />
    <meta property="og:description" content="Official flagship outlet in Kuril (Beside AIUB), Dhaka. 100% authentic disposables, pod kits & liquids with same-day delivery inside Dhaka." />

    <meta property="og:type" content="website" />

    <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('mr_mango_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
