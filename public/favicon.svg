  </defs>

  <!-- Mango Body -->
  <path d="M 50 18 C 30 18 15 35 15 60 C 15 82 32 94 52 94 C 74 94 88 80 88 56 C 88 30 70 18 50 18 Z" fill="url(#mangoGrad)"/>

