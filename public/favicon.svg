  <path d="M 54 19 C 62 9 75 5 84 9 C 76 17 68 20 54 21 Z" fill="url(#leafGrad)"/>
  
  <!-- Vape Pen Detail in Mango Center -->
  <rect x="45" y="42" width="10" height="32" rx="4" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="50" cy="50" r="2.5" fill="#FDA701"/>
  <rect x="47" y="36" width="6" height="6" rx="2" fill="#FAF5E7"/>

  <!-- Subtle Vapor Whisp -->
